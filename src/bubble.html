<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 36px;
      height: 36px;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
    }

    .bubble {
      width: 36px;
      height: 36px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: circle(50%);
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bubble:active { cursor: grabbing; }

    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #customAvatar {
      width: 36px;
      height: 36px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    #catSvg {
      width: 28px;
      height: 28px;
      display: none;
      pointer-events: none;
    }
    #activityDot { position: absolute; right: 1px; bottom: 2px; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; border: 1px solid white; pointer-events: none; }
    #activityDot.running { background: #34c759; }
    #activityDot.paused { background: #ed9a26; }
  </style>
</head>
<body>
  <div class="bubble" id="bubble">
    <!-- 优先显示自定义图片，失败则显示猫咪 -->
    <img id="customAvatar" src="../assets/bubble-avatar.png"
         onerror="this.style.display='none'; document.getElementById('catSvg').style.display='block'" />
    <svg id="catSvg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="18,42 10,12 36,36" fill="#f0f0f0" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="82,42 90,12 64,36" fill="#f0f0f0" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="50" cy="60" r="36" fill="white" stroke="#222" stroke-width="2.5"/>
      <ellipse cx="36" cy="57" rx="6.5" ry="7.5" fill="#1a1a1a"/>
      <circle cx="38" cy="54" r="2.2" fill="white"/>
      <ellipse cx="64" cy="57" rx="6.5" ry="7.5" fill="#1a1a1a"/>
      <circle cx="66" cy="54" r="2.2" fill="white"/>
      <ellipse cx="50" cy="68" rx="3.5" ry="2.5" fill="#555"/>
      <path d="M45,71 Q50,76 55,71" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="10" y1="66" x2="40" y2="68" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="10" y1="71" x2="40" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="60" y1="68" x2="90" y2="66" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="60" y1="70" x2="90" y2="71" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <span id="activityDot" aria-hidden="true"></span>
  </div>

  <script src="activity-sessions.js"></script>
  <script src="activity-time.js"></script>
  <script>
    let activityState
    function updateActivity(state) {
      activityState = state
      const current = state.activities.find(activity => activity.status === 'running')
      const paused = state.activities.filter(activity => activity.status === 'paused')
      document.getElementById('activityDot').className = current ? 'running' : paused.length ? 'paused' : ''
      document.getElementById('bubble').title = current
        ? `正在 · ${current.name} · ${Math.floor(ActivityTime.duration(current) / 60000)} 分钟`
        : paused.length ? `已暂停 · ${paused.length} 个后台事项` : 'FloatTodo · 单击展开，右键关闭'
    }
    window.api.onActivities(updateActivity)
    window.api.getActivities().then(updateActivity).catch(error => console.error('[bubble] Failed to load activities', error))
    document.getElementById('bubble').addEventListener('mouseenter', () => { if (activityState) updateActivity(activityState) })
    const bubble = document.getElementById('bubble')
    let gesture = null

    bubble.addEventListener('pointerdown', event => {
      if (event.button !== 0 || gesture) return
      gesture = {
        pointerId: event.pointerId,
        startX: event.screenX,
        startY: event.screenY,
        offsetX: event.clientX,
        offsetY: event.clientY,
        moved: false
      }
      bubble.setPointerCapture(event.pointerId)
    })

    bubble.addEventListener('pointermove', event => {
      if (!gesture || event.pointerId !== gesture.pointerId) return
      // Ignore normal click jitter, but retain drag state even when returning to the start.
      if (Math.hypot(event.screenX - gesture.startX, event.screenY - gesture.startY) >= 4) gesture.moved = true
      if (gesture.moved) window.api.moveWindow(event.screenX - gesture.offsetX, event.screenY - gesture.offsetY)
    })

    bubble.addEventListener('pointerup', event => {
      if (!gesture || event.pointerId !== gesture.pointerId) return
      const shouldRestore = !gesture.moved
      gesture = null
      bubble.releasePointerCapture(event.pointerId)
      if (shouldRestore) window.api.restoreMain()
    })

    bubble.addEventListener('pointercancel', () => { gesture = null })
    bubble.addEventListener('lostpointercapture', () => { gesture = null })
    document.addEventListener('contextmenu', event => {
      event.preventDefault()
      gesture = null
      window.api.showContextMenu()
    })
  </script>
</body>
</html>
